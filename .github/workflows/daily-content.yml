name: Daily blog and insight

# Every morning: read the latest security headlines, have Claude write today's original
# CoreDefense posts (3 blog briefs + 1 insight), and commit them. The push triggers a Vercel deploy.
on:
  schedule:
    - cron: "15 5 * * *" # 05:15 UTC daily (06:15 UK summer time, 05:15 UK winter time)
  workflow_dispatch:
    inputs:
      force:
        description: "Regenerate even if today's posts already exist"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-content
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Generate today's posts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/generate-daily-content.mjs ${{ inputs.force && '--force' || '' }}

      - name: Commit new posts
        run: |
          git config user.name "CoreDefense Content Bot"
          git config user.email "actions@users.noreply.github.com"
          git add content
          if git diff --cached --quiet; then
            echo "No new posts to commit."
          else
            git commit -m "Daily blog and insight for $(TZ=Europe/London date +%Y-%m-%d)"
            git push
          fi
